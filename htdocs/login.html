<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MasterCar</title>

    <link href="./css/reset.css" rel="stylesheet">
    <link href="./css/head_foot.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/login.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>

    <header class="cabecalho">
        <h1 class="logo">MasterCar</h1>

        <nav class="menu">
            <ul>
                <li><a href="./">Home</a></li>
                <li><a href="./sobre.html">Sobre</a></li>
                <li><a href="./login.html" class="btn-login">Login</a></li>
            </ul>
        </nav>
    </header>

    <main class="conteudo-login">
        <div class="login-card">
            <h2>Acesse sua conta</h2>
            <p>Insira seus dados para gerenciar o estoque.</p>
            
            <form method="POST" class="form-login">
                <div class="campo-login">
                    <label for="email-login">Usuário</label>
                    <input type="text" id="email-login" name="usuario" placeholder="admin" required>
                </div>
                
                <div class="campo-login">
                    <label for="senha-login">Senha</label>
                    <input type="password" id="senha-login" name="senha" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="btn-entrar">Entrar no Sistema</button>
            </form>
        </div>
    </main>

    <footer class="rodape">
        <div class="rodape-conteudo">
            <div class="rodape-logo">
                <h2>MasterCar</h2>
            </div>
            
            <div class="rodape-contato">
                <h3>Contato</h3>
                <form action="/enviar-contato" method="POST" class="form-contato">
                    <div class="campo">
                        <label for="email">E-mail:</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="campo">
                        <label for="assunto">Assunto:</label>
                        <input type="text" id="assunto" name="assunto" required>
                    </div>
                    <div class="campo">
                        <label for="mensagem">Mensagem:</label>
                        <textarea id="mensagem" name="mensagem" rows="4" required></textarea>
                    </div>
                    <button type="submit" class="btn-enviar">Enviar para o Servidor</button>
                </form>
            </div>
        </div>
    </footer>

</body>
</html>
